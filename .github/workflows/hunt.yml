name: OCI A1 capacity hunter

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AD: ${{ secrets.OCI_AD }}
      COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      DISPLAY_NAME: reels-server
      OCPUS: 2
      MEMORY_GB: 12

    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI config
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY_CONTENT" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/key.pem"
          } > ~/.oci/config
          chmod 600 ~/.oci/config

      - name: Skip if instance already exists
        run: |
          existing=$(oci compute instance list \
              --compartment-id "$COMPARTMENT_ID" \
              --query 'data[?"lifecycle-state"!=`TERMINATED` && "lifecycle-state"!=`TERMINATING`].id' \
              --raw-output 2>/dev/null)
          if [ "$existing" != "[]" ] && [ -n "$existing" ]; then
              echo "An instance already exists - nothing to do."
              echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Hunt for capacity
        if: env.SKIP != '1'
        run: |
          notify() {
              [ -z "$TG_TOKEN" ] && return 0
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                   -d chat_id="${TG_CHAT}" -d text="$1" > /dev/null || true
          }

          deadline=$(( $(date +%s) + 260 ))
          attempt=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
              attempt=$((attempt + 1))

              if out=$(oci compute instance launch \
                      --availability-domain "$AD" \
                      --compartment-id "$COMPARTMENT_ID" \
                      --shape "VM.Standard.A1.Flex" \
                      --shape-config "{\"ocpus\":${OCPUS},\"memoryInGBs\":${MEMORY_GB}}" \
                      --source-details "{\"sourceType\":\"bootVolume\",\"bootVolumeId\":\"${BOOT_VOLUME_ID}\"}" \
                      --subnet-id "$SUBNET_ID" \
                      --display-name "$DISPLAY_NAME" \
                      --assign-public-ip true 2>&1); then
                  echo "SUCCESS on attempt #${attempt}"
                  echo "$out"
                  notify "OCI: ${DISPLAY_NAME} launch accepted after ${attempt} attempts this run."
                  exit 0
              fi

              case "$out" in
                  *"Out of host capacity"*|*"out of capacity"*|*"OutOfCapacity"*)
                      echo "#${attempt} no capacity" ;;
                  *"TooManyRequests"*|*"429"*)
                      echo "#${attempt} rate limited"; sleep 60 ;;
                  *"LimitExceeded"*|*"QuotaExceeded"*|*"service limit"*)
                      echo "$out"
                      notify "OCI hunter: LIMIT/QUOTA error - fix needed."
                      exit 1 ;;
                  *"NotAuthenticated"*|*"NotAuthorizedOrNotFound"*)
                      echo "$out"
                      notify "OCI hunter: auth/OCID error - fix needed."
                      exit 1 ;;
                  *)
                      echo "#${attempt} unexpected:"; echo "$out" | head -5 ;;
              esac

              sleep 40
          done

          echo "No capacity during this run (${attempt} attempts)."
